name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Prepare GitHub Pages
        run: |
          echo "===== Generated files ====="
          find .output/public -maxdepth 3 -type f | sort

          echo ""
          echo "===== Checking SPA shell ====="

          if [ ! -f ".output/public/_shell.html" ]; then
            echo "ERROR: _shell.html was not generated"
            exit 1
          fi

          echo "Found _shell.html"

          # GitHub Pages needs index.html.
          cp .output/public/_shell.html .output/public/index.html

          # Use the same shell for GitHub Pages fallback.
          cp .output/public/_shell.html .output/public/404.html

          echo ""
          echo "===== Fixing repository paths ====="

          # Assets
          sed -i 's|/assets/|/hettarkhala/assets/|g' \
            .output/public/index.html

          sed -i 's|/assets/|/hettarkhala/assets/|g' \
            .output/public/404.html

          # Favicon
          sed -i 's|/favicon.ico|/hettarkhala/favicon.ico|g' \
            .output/public/index.html

          sed -i 's|/favicon.ico|/hettarkhala/favicon.ico|g' \
            .output/public/404.html

          echo ""
          echo "===== Final files ====="
          find .output/public -maxdepth 3 -type f | sort

          echo ""
          echo "===== index.html references ====="
          grep -oE '(href|src)="[^"]+"' \
            .output/public/index.html || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
