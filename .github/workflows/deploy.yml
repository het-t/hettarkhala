name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          # Must match the repository name exactly, with leading and trailing slash.
          GITHUB_PAGES_BASE: /hettarkhala/
        run: npm run build

      - name: Prepare GitHub Pages
        run: |
          if [ ! -f ".output/public/_shell.html" ]; then
            echo "ERROR: _shell.html was not generated"
            exit 1
          fi

          # GitHub Pages entry point, and the same shell as deep-link fallback
          # so refreshing any route loads the app instead of a 404.
          cp .output/public/_shell.html .output/public/index.html
          cp .output/public/_shell.html .output/public/404.html

          # Stop Pages from ignoring files/folders starting with an underscore.
          touch .output/public/.nojekyll

          echo "===== Generated files ====="
          find .output/public -maxdepth 3 -type f | sort

          echo "===== index.html references ====="
          grep -oE '(href|src)="[^"]+"' .output/public/index.html || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
