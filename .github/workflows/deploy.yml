name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Prepare GitHub Pages
        run: |
          echo "===== Before modification ====="
          grep -oE '(href|src)="[^"]+"' .output/public/index.html || true

          # GitHub Pages repository base path
          sed -i 's|href="/assets/|href="/hettarkhala/assets/|g' .output/public/index.html
          sed -i 's|src="/assets/|src="/hettarkhala/assets/|g' .output/public/index.html
          sed -i 's|href="/favicon.ico"|href="/hettarkhala/favicon.ico"|g' .output/public/index.html

          # Fix application navigation links in the generated HTML
          sed -i 's|href="/"|href="/hettarkhala/"|g' .output/public/index.html
          sed -i 's|href="/notes"|href="/hettarkhala/notes"|g' .output/public/index.html

          # GitHub Pages needs index.html for the root page
          # and 404.html as the SPA fallback.
          cp .output/public/index.html .output/public/404.html

          echo ""
          echo "===== After modification ====="
          grep -oE '(href|src)="[^"]+"' .output/public/index.html || true

          echo ""
          echo "===== Deployment files ====="
          find .output/public -maxdepth 3 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
