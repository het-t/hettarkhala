name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Prepare GitHub Pages
        run: |
          cp .output/public/index.html .output/public/404.html

      - name: Inspect generated HTML
        run: |
          echo "===== index.html ====="
          sed -n '1,120p' .output/public/index.html

          echo "===== Asset references ====="
          grep -oE '(href|src)="[^"]+"' .output/public/index.html || true

          echo "===== Deployment files ====="
          find .output/public -maxdepth 3 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
